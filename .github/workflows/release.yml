# Release: push a v* tag and this publishes to npm + creates the GitHub Release.
#
#   npm version patch        # bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags   # CI takes it from here
#
# Auth: preferred is npm Trusted Publishing (OIDC) — one-time setup at
# npmjs.com → package → Settings → Trusted Publisher → GitHub Actions with
# repository `taaltreelabs/on-device-llm` and workflow `release.yml`. With
# that configured, no token secret is needed (npm CLI resolves OIDC via the
# id-token permission below) and packages get provenance attestations.
# Trusted Publishing is configured for this package (2026-09-25), so no
# token secret exists or is needed.
name: Release

on:
  push:
    tags: ['v*']
  # The release button: Actions -> Release -> Run workflow. CI bumps the
  # version, commits, tags, pushes, and continues straight into the gates
  # and publish below — the full release from one click.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 bundles npm >= 11.5, which resolves npm Trusted Publishing
      # (OIDC) automatically via the id-token permission — no registry-url,
      # no token env: setup-node's registry-url writes an .npmrc that demands
      # a NODE_AUTH_TOKEN and fails config substitution before OIDC can run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Button mode only: bump, commit, tag, push. GitHub's recursion guard
      # means this tag push cannot re-trigger workflows, which is exactly
      # right — THIS run carries on to publish.
      - name: Bump version (release button)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "release: v%s"
          git push --follow-tags origin "HEAD:${{ github.ref_name }}"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag must match package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Gates
        run: |
          npm run typecheck
          npm run lint
          npm run check:isolation
          npm run test:ci
          npm run check:pack

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create "${{ steps.tag.outputs.tag }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
